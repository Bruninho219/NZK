<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Convidar NZK | Redirecionando...</title>
    <meta http-equiv="refresh" content="0; url=https://discord.com/oauth2/authorize?client_id=1497981550636044550">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔥</text></svg>">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
	<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8816082473901477" crossorigin="anonymous"></script>
    <style>
        :root {
            --bg: #1e1f22;
            --card: #313338;
            --accent: #5865f2;
            --accent-hover: #4752c4;
            --text-main: #f2f3f5;
            --text-muted: #b5bac1;
        }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text-main);
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
            text-align: center;
            padding: 24px;
            box-sizing: border-box;
        }
        .spinner {
            width: 32px;
            height: 32px;
            border: 3px solid var(--card);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        a.manual {
            color: var(--accent);
            text-decoration: none;
            font-weight: 600;
        }
        a.manual:hover { text-decoration: underline; }
        p { color: var(--text-muted); font-size: 14px; }
    </style>
    <script>
        window.location.replace("https://discord.com/oauth2/authorize?client_id=1497981550636044550");
    </script>
</head>
<body>
    <div style="font-size:40px;">🔥</div>
    <div class="spinner"></div>
    <p>Redirecionando para o Discord...</p>
    <a class="manual" href="https://discord.com/oauth2/authorize?client_id=1497981550636044550">
        Clique aqui se não for redirecionado automaticamente
    </a>
</body>
</html>
